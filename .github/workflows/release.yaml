name: Release

on:
  workflow_dispatch:
  push:
    branches: [default]
    paths-ignore:
      - CHANGELOG.md

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.current.outputs.version }}
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Version Bump
        run: cog bump --auto

      - name: Current Version
        id: current
        run: echo "version=$(cog -v get-version)" >> "${GITHUB_OUTPUT}"

      - name: Check if bumped
        id: check
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "bumped=true" >> "${GITHUB_OUTPUT}"
          else
            echo "bumped=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push bump commit
        if: steps.check.outputs.bumped == 'true'
        run: git push

      - name: Push release tag
        if: steps.check.outputs.bumped == 'true'
        run: git push origin $(git describe --tags --abbrev=0)

  build:
    needs: version
    if: needs.version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: bun ci

      - name: Build
        run: bun run build

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            dist/
            package.json
            .npmrc
            mise.toml

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Set package version
        run: bun pm pkg set version=${{ needs.version.outputs.version }}

      - name: Publish to GitHub Packages
        env:
          NPM_CONFIG_TOKEN: ${{ github.token }}
        run: bun publish -p --no-save
